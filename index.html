            "priceCurrency": "USD",
            "priceValidUntil": "2025-12-31"
          },

    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What makes Dr. Javeria's fitness coaching different?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our approach focuses on balance, not restriction. We create personalized fitness and nutrition plans that fit your lifestyle without eliminating your favorite foods. With 24/7 support and proven strategies, we help you achieve sustainable results."
          }
        },
        {
          "@type": "Question",
          "name": "How much does fitness coaching cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer three coaching plans: Silver at $189/month, Gold at $289/month (most popular), and Platinum at $389/month. Each plan includes personalized support, check-ins, and access to our fitness app."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to give up my favorite foods?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely not! Our coaching philosophy is built on balance, not deprivation. We teach you how to enjoy all foods in moderation while still reaching your fitness goals."
          }
        }
      ]
    }
